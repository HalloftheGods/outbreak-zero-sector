<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- No Google tag here on purpose: src/game/analytics/sender.ts injects it only after a player says yes. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="author" content="Hall of the Gods, Inc." />
    <meta name="description" content="A top-down pixel art zombie survival game. Scavenge an open town at night, make every round count, and hold out against the hordes, solo or in co-op." />
    <link rel="canonical" href="https://undeadofnight.forthexp.com/" />
    <!-- Link previews. Crawlers need full URLs here; public/og-image.png comes from tools/share-image.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Undead of Night: Last Round" />
    <meta property="og:title" content="Undead of Night: Last Round" />
    <meta property="og:description" content="A top-down pixel art zombie survival game. Scavenge an open town at night, make every round count, and hold out against the hordes, solo or in co-op." />
    <meta property="og:url" content="https://undeadofnight.forthexp.com/" />
    <meta property="og:image" content="https://undeadofnight.forthexp.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Undead of Night: Last Round logo over survivors and zombies on a town street at night." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Undead of Night: Last Round" />
    <meta name="twitter:description" content="A top-down pixel art zombie survival game. Scavenge an open town at night, make every round count, and hold out against the hordes, solo or in co-op." />
    <meta name="twitter:image" content="https://undeadofnight.forthexp.com/og-image.png" />
    <meta name="twitter:image:alt" content="The Undead of Night: Last Round logo over survivors and zombies on a town street at night." />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0c10;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
